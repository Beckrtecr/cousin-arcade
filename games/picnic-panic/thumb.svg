<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <pattern id="gr" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#6fbf4a"/><rect width="20" height="20" fill="#64b142"/><rect x="20" y="20" width="20" height="20" fill="#64b142"/>
    </pattern>
  </defs>
  <rect width="320" height="200" fill="url(#gr)"/>
  <!-- dirt trail -->
  <path d="M-10 50 H80 V150 H180 V60 H250 V140 H330" fill="none" stroke="#9c6b3c" stroke-width="36" stroke-linejoin="round"/>
  <path d="M-10 50 H80 V150 H180 V60 H250 V140 H330" fill="none" stroke="#c99a63" stroke-width="28" stroke-linejoin="round"/>
  <!-- flowers -->
  <g fill="#fff"><circle cx="30" cy="110" r="4"/><circle cx="36" cy="114" r="4"/><circle cx="26" cy="116" r="4"/></g>
  <g fill="#ff8fc0"><circle cx="135" cy="30" r="4"/><circle cx="141" cy="34" r="4"/><circle cx="131" cy="36" r="4"/></g>
  <!-- cake -->
  <g transform="translate(288 120)">
    <ellipse cx="0" cy="22" rx="30" ry="9" fill="#fff" stroke="#c9c2b8" stroke-width="2"/>
    <rect x="-22" y="-6" width="44" height="26" fill="#f5c98a"/>
    <rect x="-22" y="-6" width="44" height="8" fill="#ff8fb1"/>
    <ellipse cx="0" cy="-6" rx="22" ry="6" fill="#fff"/>
    <circle cx="0" cy="-12" r="6" fill="#e3263a"/>
  </g>
  <!-- ants -->
  <g fill="#3a2a22">
    <g transform="translate(40 50)"><ellipse cx="-7" cy="0" rx="6" ry="4.5"/><ellipse cx="0" cy="0" rx="3.5" ry="3"/><circle cx="6" cy="0" r="3.5"/></g>
    <g transform="translate(80 100) rotate(90)"><ellipse cx="-7" cy="0" rx="6" ry="4.5"/><ellipse cx="0" cy="0" rx="3.5" ry="3"/><circle cx="6" cy="0" r="3.5"/></g>
    <g transform="translate(150 150)"><ellipse cx="-7" cy="0" rx="6" ry="4.5"/><ellipse cx="0" cy="0" rx="3.5" ry="3"/><circle cx="6" cy="0" r="3.5"/></g>
  </g>
  <g transform="translate(180 105)"><circle r="8" fill="#e32b2b"/><circle cx="6" r="4" fill="#111"/><circle cx="-2" cy="-4" r="1.6" fill="#111"/><circle cx="-2" cy="4" r="1.6" fill="#111"/></g>
  <g transform="translate(250 95)"><ellipse rx="10" ry="8" fill="#2f7a5a"/><circle cx="9" r="4" fill="#1e4a38"/></g>
  <!-- squirt bottle tower -->
  <g transform="translate(130 100)">
    <circle r="20" fill="#e8d3ad" stroke="#7a4a24" stroke-width="3"/>
    <rect x="-12" y="-9" width="20" height="18" rx="5" fill="#4fb3ff" stroke="#1f6fa8" stroke-width="2"/>
    <rect x="6" y="-5" width="11" height="10" rx="2" fill="#fff" stroke="#1f6fa8" stroke-width="2"/>
  </g>
  <circle cx="160" cy="125" r="4" fill="#8fd3ff"/>
  <!-- honey pot tower -->
  <g transform="translate(215 30)">
    <circle r="18" fill="#e8d3ad" stroke="#7a4a24" stroke-width="3"/>
    <ellipse cy="3" rx="12" ry="11" fill="#ffb52e" stroke="#a8620a" stroke-width="2"/>
    <rect x="-9" y="-12" width="18" height="6" rx="2" fill="#d98a1a"/>
  </g>
  <!-- zap bolt -->
  <g transform="translate(120 172)">
    <circle r="16" fill="#e8d3ad" stroke="#7a4a24" stroke-width="3"/>
    <rect x="-9" y="-12" width="18" height="22" rx="3" fill="#4a3a6a"/>
    <circle cy="-1" r="4" fill="#c9a4ff"/>
  </g>
  <polyline points="120,165 132,158 138,162 150,152" fill="none" stroke="#e7dcff" stroke-width="3"/>
</svg>
