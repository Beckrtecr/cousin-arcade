<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb8f0"/><stop offset="1" stop-color="#b9e4ff"/>
    </linearGradient>
    <g id="gull">
      <circle r="20"/>
      <path d="M-14 0 Q-36 -14 -22 6 Q-14 4 -8 0Z"/>
      <path d="M14 0 Q36 -14 22 6 Q14 4 8 0Z"/>
      <path d="M14 -3 L26 0 L14 3Z" fill="#ffdbac"/>
      <circle cx="8" cy="-6" r="3.6" fill="#000"/>
    </g>
  </defs>
  <rect width="320" height="200" fill="url(#sky)"/>
  <!-- aim line + bullets -->
  <line x1="120" y1="120" x2="250" y2="60" stroke="#fff" stroke-opacity=".6" stroke-width="3"/>
  <circle cx="175" cy="95" r="6" fill="#ff0"/>
  <circle cx="210" cy="78" r="6" fill="#ff0"/>
  <!-- red enemy gulls -->
  <use href="#gull" transform="translate(255 58) scale(.9)" fill="#ff2222"/>
  <use href="#gull" transform="translate(275 145) scale(.8)" fill="#ff2222"/>
  <use href="#gull" transform="translate(40 50) scale(.7)" fill="#ff2222"/>
  <!-- player -->
  <use href="#gull" transform="translate(120 120) scale(1.4)" fill="#f5f5dc"/>
  <text x="160" y="188" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="26" fill="#fff" stroke="#0a3d62" stroke-width="5" paint-order="stroke">SUPER SEAGULLS</text>
</svg>
