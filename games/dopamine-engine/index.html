<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dopamine Engine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: an arcade cabinet split in two — a living stage that fills up with gadgets (left), a control-room shop (right). Stacks on phones. Single dark look by choice. */
:root{
  color-scheme:dark;
  --bg:#110720; --stage:#1a0c30; --panel:#1c1131; --raise:#271a43; --line:#3c2868;
  --fg:#f7f0ff; --muted:#a996ca; --hot:#ff3d9a; --cyan:#3de0ff; --sun:#ffd23d; --good:#62ffa6; --bad:#ff6b7a;
  --display:'Bungee', Impact, 'Arial Black', system-ui, sans-serif;
  --body:'Outfit', system-ui, -apple-system, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
  --hue:280;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,58%) minmax(0,42%)}}

/* ---------- STAGE ---------- */
.stage{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(120% 90% at 50% 30%, hsl(var(--hue) 70% 18%), var(--stage) 60%, #0c0518)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;z-index:1;display:flex;flex-direction:column;gap:14px;padding:0 14px 18px}
.topbar{display:flex;align-items:center;gap:10px;padding-top:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:18px;letter-spacing:.02em;line-height:1;
  background:linear-gradient(90deg,var(--hot),var(--sun),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);-webkit-text-fill-color:var(--muted);margin-top:4px}
.toggles{margin-left:auto;display:flex;gap:6px}
.tog{background:#ffffff10;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12px}
.tog[aria-pressed="false"]{opacity:.45}
.ticker{overflow:hidden;white-space:nowrap;border-block:1px solid #ff3d9a66;background:#ff3d9a1a;font-family:var(--mono);font-size:12px;padding:6px 0;border-radius:6px}
.ticker span{display:inline-block;padding-left:100%;animation:marq var(--tdur,40s) linear infinite}
.ticker b{color:var(--sun);margin:0 6px}
@keyframes marq{to{transform:translateX(-100%)}}

.hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:6px;text-align:center}
.count{font-family:var(--display);font-size:clamp(28px,5vw,46px);line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 24px #ff3d9a80}
.unit{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.rate{font-family:var(--mono);font-size:13px;color:var(--cyan)}
.level{font-size:12px;color:var(--muted)}
.level b{color:var(--sun);font-weight:800}
.big{width:190px;height:190px;border-radius:50%;border:0;margin:6px 0;position:relative;
  background:radial-gradient(circle at 35% 30%, #fff8, transparent 30%), conic-gradient(from var(--spin,0deg), var(--hot), var(--sun), var(--cyan), #9b5cff, var(--hot));
  box-shadow:0 10px 0 #6d1a52, 0 0 60px #ff3d9a70, inset 0 -10px 30px #0006;
  font-family:var(--display);font-size:26px;color:#fff;text-shadow:0 2px 0 #0007;transition:transform .05s, box-shadow .05s;user-select:none;touch-action:manipulation}
.big:active,.big.down{transform:translateY(8px) scale(.97);box-shadow:0 2px 0 #6d1a52, 0 0 90px #ff3d9aa0, inset 0 -10px 30px #0006}
.big small{display:block;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;margin-top:4px;opacity:.85}
@media (max-width:900px){.big{width:150px;height:150px;font-size:21px}}
.combo{width:min(260px,80%);height:8px;border-radius:9px;background:#ffffff14;overflow:hidden}
.combo i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--hot),var(--sun));transition:width .1s}
.combolbl{font-family:var(--mono);font-size:11px;color:var(--muted);min-height:14px}
.buffs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:0}
.buff{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:999px;background:var(--sun);color:#2a1600;font-weight:700}
.hint{font-size:13px;color:var(--muted);max-width:340px}

.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;align-items:start}
.card{background:#140a26d9;border:1px solid var(--line);border-radius:14px;padding:10px;backdrop-filter:blur(4px);min-width:0;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.card h4{margin:0 0 8px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center}
.card h4 em{margin-left:auto;font-style:normal;font-family:var(--mono);color:var(--cyan);text-transform:none;letter-spacing:0}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.toy{border-color:#ffd23d77}
.hypno{aspect-ratio:1;max-width:100%;border-radius:50%;background:repeating-conic-gradient(var(--hot) 0 15deg,#000 15deg 30deg);animation:spin 3s linear infinite;position:relative}
.hypno::after{content:"";position:absolute;inset:22%;border-radius:50%;background:repeating-radial-gradient(circle,#fff 0 6px,#000 6px 12px);animation:spin 2s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.feed{font-size:12px;display:flex;flex-direction:column;gap:3px;height:150px;overflow:hidden;justify-content:flex-end}
.feed div{animation:slide .25s ease-out;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed b{font-weight:800}
@keyframes slide{from{transform:translateY(10px);opacity:0}}
.chart{width:100%;height:110px;display:block}
.bars{display:flex;gap:3px;align-items:flex-end;height:80px}
.bars i{flex:1;background:linear-gradient(var(--cyan),var(--hot));border-radius:3px 3px 0 0;height:10%;transition:height .15s}
.wheel{width:110px;height:110px;margin:4px auto;border-radius:50%;border:6px dashed var(--sun);display:grid;place-items:center;animation:spin 2s linear infinite;position:relative}
.wheel span{font-size:40px;animation:spin 2s linear infinite reverse;display:block}
.holo{font-size:64px;text-align:center;animation:holo 3s ease-in-out infinite;filter:drop-shadow(0 0 12px var(--cyan))}
@keyframes holo{0%,100%{transform:translateY(0);filter:hue-rotate(0) drop-shadow(0 0 12px var(--cyan))}50%{transform:translateY(-8px);filter:hue-rotate(180deg) drop-shadow(0 0 22px var(--hot))}}
.say{font-size:12px;color:var(--muted);text-align:center;min-height:16px}

.wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.bub{aspect-ratio:1;border-radius:50%;border:1px solid #ffffff40;background:radial-gradient(circle at 35% 30%,#fff9,#bfe9ff55 40%,#7fc6ff22);padding:0}
.bub.popped{background:#ffffff08;border-style:dashed;pointer-events:none;transform:scale(.85)}
.spinner{width:120px;height:120px;margin:0 auto;display:block;touch-action:none;cursor:grab}
.reels{display:flex;gap:6px;justify-content:center;font-size:34px;margin-bottom:8px}
.reels span{width:52px;height:56px;display:grid;place-items:center;background:#0008;border-radius:10px;border:1px solid var(--line)}
.btn{width:100%;padding:8px;border-radius:10px;border:0;background:var(--hot);color:#fff;font-weight:800}
.btn:disabled{background:#ffffff1c;color:var(--muted);cursor:not-allowed}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.hole{aspect-ratio:1.3;border-radius:50%/40%;background:radial-gradient(ellipse at 50% 70%,#000,#2a1a10);border:0;font-size:28px;display:grid;place-items:center;padding:0}
.pet{text-align:center;font-size:40px;line-height:1.2;transition:font-size .3s;min-height:76px;display:grid;place-items:center}
.pet span{display:inline-block;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) scale(1.06,.94)}}
.robot{font-size:34px;text-align:center}
.robot span{display:inline-block;animation:tap .5s ease-in-out infinite}
@keyframes tap{50%{transform:translateY(8px) rotate(-8deg)}}

.toasts{position:absolute;top:12px;right:12px;z-index:5;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none;max-width:min(320px,80%)}
.toast{pointer-events:auto;background:#fff;color:#1b0d33;border-radius:12px;padding:8px 12px;font-size:13px;box-shadow:0 8px 24px #0008;animation:tin .3s cubic-bezier(.3,1.6,.5,1);border-left:5px solid var(--hot);cursor:default;max-width:100%}
.toast.gold{border-left-color:var(--sun);background:#fff8dc}
.toast.ach{border-left-color:var(--good)}
.toast.click{cursor:pointer}
.toast b{font-weight:800}
@keyframes tin{from{transform:translateX(40px);opacity:0}}
.orb{position:absolute;z-index:4;width:64px;height:64px;border-radius:50%;border:0;padding:0;
  background:radial-gradient(circle at 35% 30%,#fff,#ffe26b 30%,#ff9d00 70%,#b85c00);box-shadow:0 0 40px #ffd23d,0 0 90px #ff9d0080;animation:orb 1.2s ease-in-out infinite;font-size:26px}
@keyframes orb{50%{transform:scale(1.15) rotate(12deg)}}
.flash{position:absolute;inset:0;z-index:9;background:#fff;pointer-events:none;animation:fl 1.4s ease-out forwards}
@keyframes fl{to{opacity:0}}

/* ---------- SHOP ---------- */
.shop{background:var(--panel);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tabs{display:flex;gap:2px;padding:8px 8px 0;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:8px 9px;border-radius:10px 10px 0 0;font-weight:800;font-size:12px;letter-spacing:.04em;color:var(--muted);position:relative}
.tab[aria-selected="true"]{background:var(--raise);color:var(--fg)}
.tab .dot{position:absolute;top:5px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--hot)}
.shopbody{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.amt{display:flex;gap:4px;margin-bottom:2px}
.amt button{flex:1;background:#ffffff0c;border:1px solid var(--line);border-radius:8px;padding:5px;font-family:var(--mono);font-size:12px}
.amt button[aria-pressed="true"]{background:var(--cyan);color:#06202a;border-color:var(--cyan);font-weight:700}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;width:100%;
  background:var(--raise);border:1px solid transparent;border-radius:12px;padding:8px 10px;opacity:.55;transition:opacity .15s,border-color .15s,transform .06s}
.row.ok{opacity:1;border-color:#3de0ff55}
.row.ok:hover{border-color:var(--cyan)}
.row:active{transform:scale(.985)}
.row.done{opacity:.9;cursor:default;border-color:#62ffa655}
.row.locked{opacity:.35;cursor:default}
.row .ic{font-size:26px;text-align:center}
.row .nm{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ds{font-size:12px;color:var(--muted);line-height:1.3}
.row .cost{font-family:var(--mono);font-size:12px;text-align:right;color:var(--sun);font-variant-numeric:tabular-nums}
.row .cost small{display:block;color:var(--muted);font-size:10px}
.row .own{font-family:var(--display);font-size:20px;color:#ffffff30;text-align:right;line-height:1}
.sec{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:8px 2px 2px}
.box{background:var(--raise);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.box p{margin:0;color:var(--muted);line-height:1.45;font-size:13px}
.big2{font-family:var(--display);font-size:28px;color:var(--hot)}
.melt{padding:12px;border-radius:12px;border:0;font-family:var(--display);font-size:16px;background:linear-gradient(90deg,var(--hot),#ff7a3d);color:#fff}
.melt.bang{background:linear-gradient(90deg,#9b5cff,var(--cyan))}
.melt:disabled{background:#ffffff14;color:var(--muted);cursor:not-allowed}
.prog{height:6px;background:#ffffff14;border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--good)}
.ach{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--raise);border-radius:12px;padding:8px 10px}
.ach .tier{font-family:var(--display);font-size:13px;color:var(--good)}
.stat{display:flex;justify-content:space-between;gap:10px;padding:6px 2px;border-bottom:1px solid #ffffff0d;font-size:13px}
.stat span:last-child{font-family:var(--mono);color:var(--cyan);text-align:right}
textarea{width:100%;min-height:70px;background:#0006;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px;font-family:var(--mono);font-size:11px;resize:vertical}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.sbtn{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:#ffffff0c;font-weight:600;font-size:12px}
.sbtn.danger{border-color:var(--bad);color:var(--bad)}
/* ---------- STYLE: layout with video wall, hats, button skins, cursor ---------- */
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:1250px){.main.hasTv{grid-template-columns:minmax(0,1fr) 250px}.main.hasTv .tv{grid-template-columns:1fr}}
.center{display:flex;flex-direction:column;gap:14px;min-width:0}
.tv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;align-content:start;min-width:0}
.tv:empty{display:none}
.vid{padding:6px;border-color:#3de0ff66;cursor:pointer}
.vid canvas{width:100%;height:auto;display:block;border-radius:8px;background:#000}
.vt{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;margin-top:6px;min-width:0}
.vt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vt em{margin-left:auto;font-style:normal;font-family:var(--mono);color:var(--muted);font-size:10px;white-space:nowrap}
.btnwrap{position:relative;display:inline-block;margin-top:30px}
.btnwrap.sq{margin-bottom:22px}
.hat{position:absolute;left:50%;top:0;transform:translate(-50%,-62%) rotate(-8deg);font-size:64px;line-height:1;pointer-events:none;z-index:2;white-space:nowrap;animation:hat 2.4s ease-in-out infinite;filter:drop-shadow(0 4px 6px #0008)}
@keyframes hat{50%{transform:translate(-50%,-70%) rotate(6deg)}}
.hat.halo{width:120px;height:28px;border-radius:50%;border:7px solid #ffe26b;box-shadow:0 0 20px #ffd23d,inset 0 0 12px #ffd23d;top:-16px}
.big.sk{width:auto;height:auto;margin:0;border-radius:10px;background:#fff;color:#1f1f1f;font-family:var(--body);font-weight:700;font-size:22px;text-shadow:none;padding:16px 30px;box-shadow:0 6px 0 #0007,0 0 40px #ffffff30;display:inline-flex;align-items:center;justify-content:center;gap:12px;border:1px solid #dadce0;max-width:80vw}
.big.sk:active,.big.sk.down{transform:translateY(5px);box-shadow:0 1px 0 #0007}
.big.sk #clickVal{position:absolute;left:50%;top:calc(100% + 10px);transform:translateX(-50%);color:var(--cyan);white-space:nowrap;margin:0}
.big .ico{font-size:1.1em}
.big.sk-signin{border-radius:999px}
.big.sk-robot{background:#f9f9f9;border:1px solid #d3d3d3;border-radius:4px;padding:14px 14px 14px 16px;font-weight:500;font-size:17px;color:#222;gap:14px;min-width:270px}
.sk-robot .cb{width:28px;height:28px;border:2px solid #c1c1c1;border-radius:3px;background:#fff;display:grid;place-items:center;flex:none}
.big.sk-robot.checked .cb::after{content:'✔';color:#1e9e4a;font-size:24px;line-height:1}
.sk-robot .tx{flex:1;text-align:left}
.sk-robot .cap{font-size:22px;display:flex;flex-direction:column;align-items:center;color:#888}
.sk-robot .cap small{font-size:9px}
.big.sk-cookies,.big.sk-watch{background:#22222a;color:#fff;border-color:#444;font-size:15px;font-weight:500;flex-direction:column;gap:10px}
.big .pill{background:#2fbf71;color:#fff;border-radius:999px;padding:8px 20px;font-weight:800}
.sk-watch .pill{background:#fff;color:#111}
.big.sk-skip{background:rgba(0,0,0,.8);color:#fff;border:1px solid #fff8;border-radius:2px;font-weight:500}
.big.sk-sub{background:#ff2b2b;color:#fff;border:0;border-radius:6px;font-weight:800;letter-spacing:.04em}
.big.sk-like{background:#eef1f5;border-radius:999px}
.big.sk-buy{background:linear-gradient(#ffe27a,#ffc533);border-color:#d9a400;border-radius:999px}
.big.sk-dl{background:linear-gradient(#53e86b,#14a83b);color:#fff;border:3px solid #fff;font-family:var(--display);font-weight:400;flex-direction:column;gap:2px;animation:dlb .6s steps(2) infinite}
.sk-dl .sub{font-family:var(--body);font-size:12px;color:#fffb}
@keyframes dlb{50%{filter:brightness(1.3)}}
.big.sk-snooze{background:#ff9f1c;color:#fff;border:0;border-radius:16px}
.big.sk-red,.big.sk-elev,.big.sk-bell,.big.sk-cookie,.big.sk-golden{width:170px;height:170px;border-radius:50%;padding:0;text-align:center;line-height:1.1}
.big.sk-red{background:radial-gradient(circle at 40% 30%,#ff8080,#d40000 55%,#7a0000);color:#fff;border:10px solid #333;font-family:var(--display);font-weight:400;font-size:20px}
.big.sk-elev{background:radial-gradient(circle at 40% 30%,#f4f4f4,#a9adb3 60%,#6f747a);border:8px solid #c9ccd1;font-size:54px;color:#ffb020;text-shadow:0 0 18px #ffb020;width:130px;height:130px}
.big.sk-cross{background:#f2c200;border:6px solid #222;border-radius:14px;flex-direction:column;font-size:15px;color:#111;font-weight:900}
.sk-cross .dot{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#ccc,#555);border:4px solid #222}
.big.sk-bell{background:radial-gradient(circle at 40% 30%,#ffe7a3,#c99a2e 60%,#7d5a12);border:10px solid #3a2a12;font-size:60px;width:140px;height:140px}
.big.sk-space{background:linear-gradient(#fafafa,#d9d9d9);border:1px solid #aaa;border-radius:12px;width:320px;height:64px;font-weight:500;color:#666;box-shadow:0 8px 0 #9a9a9a,0 10px 20px #0006}
.big.sk-cookie{background:radial-gradient(circle at 30% 30%,#5a3210 0 7px,transparent 8px),radial-gradient(circle at 65% 40%,#5a3210 0 9px,transparent 10px),radial-gradient(circle at 45% 70%,#5a3210 0 8px,transparent 9px),radial-gradient(circle at 75% 72%,#5a3210 0 6px,transparent 7px),radial-gradient(circle at 40% 35%,#f0c27a,#c98a3c 70%,#9a6424);border:0}
.big.sk-next{background:linear-gradient(#fdfdfd,#e1e1e1);border:1px solid #707070;border-radius:3px;font-family:Tahoma,'Segoe UI',sans-serif;font-weight:400;font-size:18px;padding:10px 40px;outline:1px dotted #333;outline-offset:-5px}
.big.sk-launch{background:repeating-linear-gradient(45deg,#ffd200 0 18px,#111 18px 36px);color:#fff;border:4px solid #111;font-family:var(--display);font-weight:400;font-size:30px;text-shadow:0 2px 0 #000,0 0 10px #000;padding:22px 34px}
.big.sk-golden{background:radial-gradient(circle at 35% 30%,#fff7c2,#ffd23d 40%,#c98a00 80%);border:0;color:#6b4300;font-family:var(--display);font-weight:400;box-shadow:0 8px 0 #8a5a00,0 0 80px #ffd23d}
body.cc,body.cc *{cursor:none!important}
#cur{position:fixed;left:0;top:0;z-index:10001;pointer-events:none;font-size:30px;line-height:1;margin:-15px 0 0 -15px;transform:translate(-200px,-200px);will-change:transform}
#cur span{display:block}
#cur.squish span{animation:sq .18s ease-out}
@keyframes sq{50%{transform:scale(.7) rotate(-15deg)}}
#trail{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10000}
/* scenes */
.stage[data-bg="ocean"]{background:linear-gradient(#0d4f7a,#06233d 60%,#020e1c)}
.stage[data-bg="sunset"]{background:linear-gradient(#5b2a86 0%,#b8336a 45%,#f08a4b 80%,#f7c26b)}
.stage[data-bg="jungle"]{background:radial-gradient(120% 90% at 50% 20%,#2f7a3a,#123d1c 60%,#071a0c)}
.stage[data-bg="synth"]{background:repeating-linear-gradient(90deg,#3de0ff22 0 2px,transparent 2px 60px),repeating-linear-gradient(0deg,#ff3d9a22 0 2px,transparent 2px 40px),linear-gradient(#2a0845,#120322)}
.stage[data-bg="space"]{background:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 60%,#fff,transparent),radial-gradient(1px 1px at 40% 80%,#fff,transparent),radial-gradient(1px 1px at 85% 15%,#fff,transparent),radial-gradient(1px 1px at 55% 40%,#fff,transparent),radial-gradient(80% 60% at 70% 30%,#3b1d6e,transparent),#05030f;background-size:180px 180px,240px 240px,200px 200px,260px 260px,150px 150px,100% 100%}
.stage[data-bg="candy"]{background:repeating-linear-gradient(45deg,#7a1f5c 0 30px,#5a1748 30px 60px)}
.stage[data-bg="lava"]{background:radial-gradient(120% 80% at 50% 110%,#ff5a1f,#8a1c06 45%,#2a0703)}
.stage[data-bg="arctic"]{background:linear-gradient(#0b2a4a,#164a6e 60%,#3f7fa3)}
.stage[data-bg="checker"]{background:repeating-conic-gradient(#2a1a4a 0 25%,#1a0f30 0 50%) 0 0/60px 60px}
.stage[data-bg="rainbowbg"]{background:conic-gradient(from 0deg at 50% 40%,#7a1f5c,#7a5a1f,#1f7a3a,#1f5c7a,#4a1f7a,#7a1f5c)}
.stage[data-bg="gold"]{background:radial-gradient(120% 90% at 50% 30%,#8a6a10,#4a3505 60%,#1f1502)}
.stage[data-bg="void"]{background:#000}
/* more button skins */
.big.sk-unsub{background:transparent;color:#9aa;border:0;box-shadow:none;font-size:12px;font-weight:400;padding:4px 8px;text-decoration:underline}
.big.sk-retry{background:#4a4a55;color:#fff;border:0}
.big.sk-ok{background:#ece9d8;color:#111;border:2px solid #0a246a;border-radius:4px;flex-direction:column;gap:10px;font-weight:400;font-size:14px;padding:14px 22px}
.sk-ok .okb{border:1px solid #003c74;background:linear-gradient(#fff,#d6d0c4);padding:4px 30px;border-radius:3px}
.big.sk-agree{background:#1a73e8;color:#fff;border:0;border-radius:6px;font-size:16px}
.big.sk-claim{background:linear-gradient(90deg,#ff4fd8,#ff9500);color:#fff;border:3px dashed #fff;font-family:var(--display);font-weight:400;animation:dlb .4s steps(2) infinite}
.big.sk-panic{background:#ff1e1e;color:#fff;border:6px solid #fff;font-family:var(--display);font-weight:400;font-size:32px;animation:panic .15s infinite}
@keyframes panic{50%{transform:translate(2px,-1px) rotate(1deg)}}
.big.sk-refresh,.big.sk-arcade,.big.sk-jelly,.big.sk-eye{width:160px;height:160px;border-radius:50%;padding:0}
.big.sk-refresh{background:radial-gradient(circle at 40% 30%,#fff,#c9ccd6);font-size:70px;color:#555;border:0}
.big.sk-arcade{background:radial-gradient(circle at 45% 35%,#7fd0ff,#1a6fe0 55%,#0b3a80);border:14px solid #222;box-shadow:0 0 0 6px #555,0 10px 0 #111}
.big.sk-jelly{background:radial-gradient(circle at 35% 30%,#fff9,#ff7ac7 40%,#d6339b);border:0}
.big.sk-jelly:active,.big.sk-jelly.down{transform:scale(1.25,.7)}
.big.sk-eye{background:radial-gradient(circle at 50% 50%,#000 0 16px,#2a7be4 17px 38px,#fff 39px);border:4px solid #f3d3d3}
/* new toys */
.pops{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:linear-gradient(135deg,#ff6ad5,#c774e8,#ad8cff,#8795e8,#94d0ff);padding:8px;border-radius:14px}
.pit{aspect-ratio:1;border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 40% 35%,#fff8,#fff0 60%),#ffffff33;box-shadow:0 3px 0 #0003}
.pit.in{box-shadow:inset 0 3px 6px #0006;background:#0002}
.keys{display:flex;gap:2px;height:90px}
.key{flex:1;border:0;border-radius:0 0 6px 6px;background:linear-gradient(#fff,#e6e6e6);box-shadow:0 4px 0 #aaa;color:#888;font-size:10px;font-weight:700;display:flex;align-items:flex-end;justify-content:center;padding:0 0 6px}
.key.hit{background:var(--sun);transform:translateY(2px);box-shadow:0 2px 0 #aaa}
.gift{font-size:60px;background:none;border:0;display:block;margin:0 auto;padding:0;animation:bob 1.2s ease-in-out infinite}
.gift:disabled{filter:grayscale(1);opacity:.45;animation:none;cursor:not-allowed}
/* boss */
.boss{position:absolute;z-index:4;border:0;background:none;padding:0;font-size:110px;line-height:1;filter:drop-shadow(0 0 30px #ff3d9a);transition:left 1s,top 1s;animation:bossb 1s ease-in-out infinite}
.boss .hp{position:absolute;left:10%;right:10%;bottom:-12px;height:10px;background:#0009;border-radius:9px;overflow:hidden}
.boss .hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--hot),var(--sun))}
.boss .bt{position:absolute;left:-40px;right:-40px;top:-22px;font:800 12px var(--mono);color:#fff;text-align:center;white-space:nowrap;text-shadow:0 1px 3px #000}
.boss.hit{animation:bhit .12s}
@keyframes bossb{50%{transform:translateY(-10px) rotate(4deg)}}
@keyframes bhit{50%{transform:scale(.88) rotate(-6deg)}}
@media (prefers-reduced-motion:reduce){.hat,.big.sk-dl,.big.sk-claim,.big.sk-panic,.boss,.gift{animation:none}}
@media (prefers-reduced-motion:reduce){.ticker span,.hypno,.hypno::after,.wheel,.wheel span,.holo,.orb,.pet span,.robot span{animation-duration:20s!important}}

function fresh() {

const KEY = 'dopamine-engine-save-v1';
function load(data) {
  let src = data && data.buzz !== undefined ? data : null;
  if (!src) { try { const raw = localStorage.getItem(KEY); if (raw) src = JSON.parse(raw); } catch (e) {} }
  if (src) {
    const f = fresh(), dStats = f.stats, dSet = f.settings;
    S = Object.assign(f, src);
    S.stats = Object.assign(dStats, src.stats || {});
    S.settings = Object.assign(dSet, src.settings || {});
    for (const k in S.stats) if (typeof S.stats[k] !== 'number' || !isFinite(S.stats[k])) S.stats[k] = 0;
    for (const k of ['buzz', 'runEarned', 'allEarned', 'synapses', 'chips', 'pet', 'robot', 'universes']) if (typeof S[k] !== 'number' || isNaN(S[k])) S[k] = 0;

}

const cntId = id => cnt(IDX[id]);

let BPS = 0, BASEBPS = 0, achTotal = 0;
const buffs = []; // {id,name,mult,click,t}
const buffMult = k => buffs.reduce((m, b) => m * (b[k] || 1), 1);
let spinVel = 0;

function globalMult() {
  return Math.pow(2, S.ou) * Math.pow(3, S.hu) * (1 + 0.05 * nOwn(S.cursors)) * (1 + 0.04 * nOwn(S.buttons)) * (1 + 0.08 * nOwn(S.hats)) * Math.pow(1.25, nOwn(S.videos)) * (1 + 0.06 * nOwn(S.bgs)) * (1 + 0.01 * S.stats.bosses) * (1 + 0.02 * achTotal) * (1 + 0.05 * S.synapses) * (1 + 0.25 * perk('overclock'))
    * Math.pow(3, S.universes) * (1 + 0.03 * S.pet) * (toy('spinner') ? spinBonus() : 1) * buffMult('mult');
}

}

}
