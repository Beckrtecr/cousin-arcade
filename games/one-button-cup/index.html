<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Button Cup</title>
<style>
  :root { --bg:#060a1c; --panel:#0f1736; --line:#26315f; --ink:#f3f5ff; --mute:#9aa6d1; --hot:#ffc83a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { position:fixed; inset:0; display:block; }
  .overlay { position:fixed; inset:0; display:flex; align-items:safe center; justify-content:center; padding:20px;
    background:radial-gradient(ellipse at 50% 30%, rgba(40,58,130,.75), rgba(6,10,28,.94)); overflow:auto; }
  .overlay[hidden] { display:none; }
  .box { width:min(760px, 100%); text-align:center; }
  h1 { margin:0; font-size:clamp(34px, 7vw, 68px); font-weight:900; letter-spacing:-.02em; line-height:1;
    text-shadow:0 5px 0 #0b1026; }
  h1 span { color:var(--hot); }
  .sub { margin:10px 0 20px; color:var(--mute); font-size:16px; }
  #cards { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; }
  @media (max-width:620px) { #cards { grid-template-columns:repeat(2, 1fr); } }
  .card { font:inherit; color:inherit; cursor:pointer; background:var(--panel); border:2px solid var(--line);
    border-radius:16px; padding:12px 8px 10px; display:flex; flex-direction:column; align-items:center; gap:5px;
    transition:transform .12s, border-color .12s; }
  .card.in { border-color:var(--pc); transform:translateY(-4px); }
  .cap { width:52px; height:52px; border-radius:14px; display:grid; place-items:center; font-size:28px; font-weight:900;
    background:var(--line); color:var(--mute); box-shadow:0 5px 0 rgba(0,0,0,.45); }
  .card.in .cap { background:var(--pc); color:#0b1026; }
  .pn { font-weight:900; font-size:17px; color:var(--pc); }
  .st { font-size:12px; color:var(--mute); min-height:30px; }
  .card.in .st { color:var(--ink); font-weight:800; letter-spacing:.08em; }
  #cards.n2 { grid-template-columns:repeat(2, minmax(0, 190px)); justify-content:center; }
  #cards.n3 { grid-template-columns:repeat(3, minmax(0, 190px)); justify-content:center; }
  .card[hidden] { display:none; }
  .opts { display:flex; flex-wrap:wrap; justify-content:center; gap:12px 24px; margin:18px 0 10px; }
  .opt { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .opt.wide { flex-basis:100%; }
  .opt label { font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); }
  .modes { display:inline-flex; flex-wrap:wrap; justify-content:center; background:var(--panel); border:2px solid var(--line); border-radius:22px; padding:4px; }
  .modes button { font:inherit; font-weight:800; color:var(--mute); background:none; border:0; padding:7px 13px; border-radius:999px; cursor:pointer; font-size:14px; }
  .modes button.on { background:var(--ink); color:#0b1026; }
  .modes button:disabled { opacity:.3; cursor:not-allowed; }
  #duelNote { text-transform:none; letter-spacing:0; font-weight:600; }
  .how { color:var(--mute); font-size:14px; min-height:40px; max-width:560px; margin:0 auto 18px; line-height:1.45; }
  .go { font:inherit; font-size:20px; font-weight:900; color:#0b1026; background:var(--hot); border:0; border-radius:14px;
    padding:14px 34px; cursor:pointer; box-shadow:0 6px 0 #a87600; }
  .go:active { transform:translateY(4px); box-shadow:0 2px 0 #a87600; }
  .go:focus-visible, .card:focus-visible, .modes button:focus-visible { outline:3px solid #fff; outline-offset:3px; }
  .tip { margin-top:16px; color:var(--mute); font-size:12.5px; }
  kbd { background:var(--line); color:var(--ink); border-radius:5px; padding:1px 6px; font:inherit; font-weight:800; }
  h2 { margin:0 0 20px; font-size:clamp(26px, 5vw, 44px); font-weight:900; }
  .row { background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:16px; margin:10px 0; font-size:24px; }
  .row span { display:block; font-size:12px; letter-spacing:.14em; color:var(--mute); font-weight:800; margin-bottom:4px; }
  .row i { color:var(--mute); font-style:normal; font-size:16px; margin:0 8px; }
  .note { color:var(--mute); margin:14px 0 0; font-size:14px; }
  #inter .go, #results .go { margin-top:22px; }
  #podium { display:grid; gap:10px; }
  .place { display:flex; align-items:center; gap:16px; background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:12px 20px; }
  .place span { width:52px; text-align:left; font-weight:900; color:var(--mute); }
  .place b { font-size:22px; color:var(--pc); }
  .place em { font-style:normal; font-size:11px; font-weight:800; color:var(--mute); border:1px solid var(--line); border-radius:6px; padding:2px 6px; }
  .place.sm { padding:9px 18px; } .place.sm b { font-size:19px; flex:1; text-align:left; } .place.sm span { width:24px; }
  .place.sm strong { font-size:18px; min-width:64px; text-align:right; }
  .place.p0 { border-color:var(--pc); padding:20px; }
  .place.p0 b { font-size:36px; }
  .place.p0 span { color:var(--hot); }
  @media (prefers-reduced-motion: reduce) { .card { transition:none; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="overlay" id="lobby">
  <div class="box">
    <h1>ONE BUTTON <span>CUP</span></h1>
    <p class="sub" id="sub"></p>
    <div id="cards"></div>
    <div class="opts">
      <div class="opt"><label>Players</label>
        <div class="modes" role="group" aria-label="Players"><button data-count="2">2</button><button data-count="3">3</button><button data-count="4">4</button></div></div>
      <div class="opt"><label>CPU difficulty</label>
        <div class="modes" role="group" aria-label="CPU difficulty"><button data-skill="0">Easy</button><button data-skill="1">Normal</button><button data-skill="2">Hard</button></div></div>
      <div class="opt"><label>Format</label><div class="modes" id="mixBtns" role="group" aria-label="Format"></div></div>
      <div class="opt wide"><label>Or pick one: everyone in the same game</label><div class="modes" id="ffaBtns" role="group"></div></div>
      <div class="opt wide"><label>Or pick one: head to head <span id="duelNote"></span></label><div class="modes" id="duelBtns" role="group"></div></div>
    </div>
    <p class="how" id="how"></p>
    <button class="go" id="start">Start tournament</button>
    <p class="tip">Press your key to join. Empty seats are played by the computer. <kbd>Enter</kbd> starts, <kbd>Esc</kbd> quits a game. Gamepads work too: any button.</p>
  </div>
</div>

<div class="overlay" id="inter" hidden>
  <div class="box">
    <h2 id="interTitle"></h2>
    <div id="interBody"></div>
    <button class="go" id="skip">Start round two</button>
  </div>
</div>

<div class="overlay" id="results" hidden>
  <div class="box">
    <h2>Final standings</h2>
    <div id="podium"></div>
    <p class="note" id="resNote"></p>
    <button class="go" id="again">Play again</button>
  </div>
</div>

<script>
'use strict';
/* ONE BUTTON CUP — four players, one key each, two matches at once. */

const W = 480, H = 300, G = 262;           // arena size and ground line
const HEAD = 44;                            // header strip above each arena
const PW = W, PH = H + HEAD;                // panel size
const GOALW = 34, GOALH = 86;
const JUMP = 330, GRAV = 900, KICK = 0.3, BALL_G = 650;

const PLAYERS = [
  { name: 'RED',   code: 'KeyQ', label: 'Q', color: '#ff5d52', dark: '#a8261d' },
  { name: 'BLUE',  code: 'KeyC', label: 'C', color: '#4aa3ff', dark: '#1a559f' },
  { name: 'GOLD',  code: 'KeyM', label: 'M', color: '#ffc83a', dark: '#a87600' },
  { name: 'GREEN', code: 'KeyP', label: 'P', color: '#5bd46a', dark: '#22802e' },
];

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = (a, b) => a + Math.random() * (b - a);

function hitCircle(b, cx, cy, cr, cvx, cvy, e) {
  const dx = b.x - cx, dy = b.y - cy, d = Math.hypot(dx, dy), min = b.r + cr;
  if (d >= min || d === 0) return false;
  const nx = dx / d, ny = dy / d;
  b.x = cx + nx * min; b.y = cy + ny * min;
  const rv = (b.vx - cvx) * nx + (b.vy - cvy) * ny;
  if (rv < 0) { b.vx -= (1 + e) * rv * nx; b.vy -= (1 + e) * rv * ny; }
  return true;
}

/* ---------------- SOCCER ---------------- */
class Soccer {
  constructor() {
    this.target = 3; this.time = 75; this.events = [];
    this.name = 'SOCCER'; this.cheer = 'GOAL!'; this.hint = 'Tap to jump the way your guys lean, and kick';
    this.kickV = [250, 330, 210, 300];
    this.reset(0);
  }
  mk(team, home, speed, lo, hi) {
    return { team, home, lo, hi, x: home, y: G, vx: 0, vy: 0, a: 0, w: 0,
      phase: rnd(0, 6.28), speed, ground: true, kick: 0, kickUsed: true, face: team === 0 ? 1 : -1 };
  }

  reset(dir) {
    this.ball = { x: W / 2 + dir * 50, y: 60, vx: rnd(-40, 40), vy: 0, r: 9, rot: 0 };
    this.still = 0;
    const lo = GOALW + 10, hi = W - GOALW - 10;
    this.guys = [this.mk(0, 80, 2.7, lo, hi), this.mk(0, 190, 3.5, lo, hi), this.mk(1, W - 80, 2.7, lo, hi), this.mk(1, W - 190, 3.5, lo, hi)];
  }

  stepGuy(g, dt, tap) {
    const A = 0.5;
    if (g.kick > 0) g.kick -= dt;
    if (g.ground) {
      g.phase += g.speed * dt;
      const bias = clamp((g.home - g.x) * 0.005, -0.3, 0.3);
      const target = A * Math.sin(g.phase) + bias;
      g.a += (target - g.a) * Math.min(1, 14 * dt);
      if (tap) {
        g.ground = false;
        g.vx = Math.sin(g.a) * JUMP * 1.1;
        g.vy = -Math.cos(g.a) * JUMP;
        g.w = Math.cos(g.phase) * 1.1;
        g.kick = KICK; g.kickUsed = false;
        this.events.push('jump');
      }
    } else {
      if (tap && g.kick <= 0) { g.kick = KICK; g.kickUsed = false; }
      g.vy += GRAV * dt; g.x += g.vx * dt; g.y += g.vy * dt; g.a += g.w * dt;
      const lo = g.lo, hi = g.hi;
      if (g.x < lo) { g.x = lo; g.vx = Math.abs(g.vx) * 0.4; }
      if (g.x > hi) { g.x = hi; g.vx = -Math.abs(g.vx) * 0.4; }
      if (g.y >= G) {
        g.y = G; g.ground = true; g.vx = 0; g.vy = 0;
        g.a = clamp(g.a, -A, A);
        g.phase = Math.asin(clamp(g.a / A, -1, 1));
        if (g.w < 0) g.phase = Math.PI - g.phase;
      }
    }
  }

  // body points used for both collision and drawing
  parts(g) {
    const ux = Math.sin(g.a), uy = -Math.cos(g.a);
    const p = {
      ux, uy,
      hip: [g.x + ux * 16, g.y + uy * 16],
      torso: [g.x + ux * 26, g.y + uy * 26],
      sh: [g.x + ux * 36, g.y + uy * 36],
      head: [g.x + ux * 45, g.y + uy * 45],
      foot: null,
    };
    if (g.kick > 0) {
      const t = 1 - g.kick / KICK;
      const th = -0.5 + t * 2.2;
      const ang = Math.atan2(Math.cos(g.a), -Math.sin(g.a)) - g.face * th;
      p.foot = [p.hip[0] + Math.cos(ang) * 20, p.hip[1] + Math.sin(ang) * 20];
    }
    return p;
  }

  seg(b, x1, y1, x2, y2) {
    const t = clamp(((b.x - x1) * (x2 - x1) + (b.y - y1) * (y2 - y1)) / ((x2 - x1) ** 2 + (y2 - y1) ** 2), 0, 1);
    return hitCircle(b, x1 + t * (x2 - x1), y1 + t * (y2 - y1), 2.5, 0, 0, 0.6);
  }

  step(dt, taps) {
    for (const g of this.guys) this.stepGuy(g, dt, taps[g.team]);
    const b = this.ball;
    b.vy += BALL_G * dt; b.vx *= 1 - 0.15 * dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.rot += (b.vx * dt) / b.r;

    this.obstacles(b); let grounded = false;
    if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx) * 0.8; }
    if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx) * 0.8; }
    if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy) * 0.8; }
    if (b.y + b.r > G) {
      b.y = G - b.r; grounded = true;
      if (b.vy > 90) this.events.push('bounce');
      b.vy = -b.vy * 0.7; if (Math.abs(b.vy) < 40) b.vy = 0;
      b.vx *= 1 - 1.5 * dt;
    }

    for (const g of this.guys) {
      const p = this.parts(g);
      hitCircle(b, p.torso[0], p.torso[1], 11, g.vx, g.vy, 0.5);
      if (hitCircle(b, p.head[0], p.head[1], 9, g.vx, g.vy, 0.85)) this.events.push('bounce');
      if (p.foot && hitCircle(b, p.foot[0], p.foot[1], 7, g.vx, g.vy, 0.6) && !g.kickUsed) {
        g.kickUsed = true;
        const k = this.kickV;
        b.vx = g.face * rnd(k[0], k[1]) + g.vx * 0.4;
        b.vy = -rnd(k[2], k[3]);
        this.events.push('kick');
      }
    }
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > 700) { b.vx *= 700 / sp; b.vy *= 700 / sp; }

    return this.result(b, sp, dt, grounded);
  }
  obstacles(b) { const bar = G - GOALH; this.seg(b, 0, bar, GOALW, bar); this.seg(b, W - GOALW, bar, W, bar); }
  unstick(b, sp, dt) {
    if (sp < 14) { this.still += dt; if (this.still > 2.5) { b.vy = -330; b.vx = rnd(-120, 120); this.still = 0; } }
    else this.still = 0;
  }
  result(b, sp, dt) {
    this.unstick(b, sp, dt);
    if (b.y > G - GOALH + 3) {
      if (b.x < GOALW - b.r * 0.5) return 1;       // right team scores
      if (b.x > W - GOALW + b.r * 0.5) return 0;   // left team scores
    }
    return -1;
  }

  bot(side, skill) {
    const b = this.ball, face = side === 0 ? 1 : -1, pr = [0.15, 0.45, 0.9][skill];
    for (const g of this.guys) {
      if (g.team !== side) continue;
      const dx = b.x - g.x;
      if (g.ground) {
        if (Math.abs(dx) < 80 && b.y > G - 125) {
          const want = dx * face > -12 ? face : Math.sign(dx);
          if (Math.sign(g.a) === want && Math.abs(g.a) > 0.15 && Math.random() < pr) return 0.3;
        }
      } else if (g.kick <= 0 && Math.abs(dx) < 34 && Math.abs(b.y - (g.y - 18)) < 34 && Math.random() < pr) return 0.2;
    }
    return 0;
  }

  backdrop(c, L, R, t) {
    // sky + stands
    const sky = c.createLinearGradient(0, 0, 0, G);
    sky.addColorStop(0, '#172a5c'); sky.addColorStop(1, '#3b6fb5');
    c.fillStyle = sky; c.fillRect(0, 0, W, G);
    c.fillStyle = '#101c40'; c.fillRect(0, 96, W, 60);
    for (let i = 0; i < 120; i++) {
      const x = (i * 53) % W, y = 102 + ((i * 29) % 48);
      c.fillStyle = ['#ff5d52', '#4aa3ff', '#ffc83a', '#5bd46a', '#e9edf7'][i % 5];
      c.globalAlpha = 0.55; c.fillRect(x, y + Math.sin(t * 5 + i) * 1.2, 3, 4);
    }
    c.globalAlpha = 1;
    c.fillStyle = '#0c1634'; c.fillRect(0, 156, W, 8);
    // pitch
    c.fillStyle = '#2f9e48'; c.fillRect(0, G, W, H - G);
    c.fillStyle = '#3fb65a'; for (let i = 0; i < W; i += 60) c.fillRect(i, G, 30, H - G);
    c.fillStyle = '#e9f7ec'; c.fillRect(0, G, W, 3);
    c.fillStyle = 'rgba(255,255,255,.5)'; c.fillRect(W / 2 - 1, G, 2, H - G);
    // goals
    for (const s of [0, 1]) {
      const x0 = s ? W - GOALW : 0, top = G - GOALH;
      c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1; c.beginPath();
      for (let i = 6; i < GOALW; i += 7) { c.moveTo(x0 + i, top); c.lineTo(x0 + i, G); }
      for (let j = 8; j < GOALH; j += 8) { c.moveTo(x0, top + j); c.lineTo(x0 + GOALW, top + j); }
      c.stroke();
      c.strokeStyle = '#fff'; c.lineWidth = 5; c.lineCap = 'round'; c.beginPath();
      c.moveTo(x0, top); c.lineTo(x0 + GOALW, top);
      const back = s ? W - 2 : 2; c.moveTo(back, top); c.lineTo(back, G);
      c.stroke();
      c.fillStyle = (s ? R : L).color; c.fillRect(s ? W - 5 : 0, top - 16, 5, 12);
    }
  }
  draw(c, L, R, t) {
    this.backdrop(c, L, R, t);
    c.fillStyle = 'rgba(0,0,0,.25)';
    for (const g of this.guys) { c.beginPath(); c.ellipse(g.x, G + 4, 13, 3.5, 0, 0, 7); c.fill(); }
    const b = this.ball;
    c.beginPath(); c.ellipse(b.x, G + 4, 8, 2.5, 0, 0, 7); c.fill();
    // guys
    for (const g of this.guys) this.drawGuy(c, g, g.team ? R : L);
    // ball
    c.save(); c.translate(b.x, b.y); c.rotate(b.rot);
    c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, b.r, 0, 7); c.fill();
    c.fillStyle = '#1b1f2e'; c.beginPath(); c.arc(0, 0, 3.2, 0, 7); c.fill();
    for (let i = 0; i < 5; i++) { const a = i * 1.2566; c.beginPath(); c.arc(Math.cos(a) * 7.5, Math.sin(a) * 7.5, 2.2, 0, 7); c.fill(); }
    c.strokeStyle = '#1b1f2e'; c.lineWidth = 1.2; c.beginPath(); c.arc(0, 0, b.r, 0, 7); c.stroke();
    c.restore();
  }

  drawGuy(c, g, P) {
    const p = this.parts(g), px = -p.uy, py = p.ux; // perpendicular
    c.lineCap = 'round';
    c.strokeStyle = '#1b1f2e'; c.lineWidth = 6;
    const back = [g.x - px * 4 * g.face, g.y - py * 4 * g.face];
    const front = p.foot || [g.x + px * 4 * g.face, g.y + py * 4 * g.face];
    c.beginPath(); c.moveTo(p.hip[0], p.hip[1]); c.lineTo(back[0], back[1]);
    c.moveTo(p.hip[0], p.hip[1]); c.lineTo(front[0], front[1]); c.stroke();
    if (p.foot) { c.fillStyle = '#fff'; c.beginPath(); c.arc(p.foot[0], p.foot[1], 5, 0, 7); c.fill(); }
    c.strokeStyle = P.color; c.lineWidth = 17;
    c.beginPath(); c.moveTo(p.hip[0], p.hip[1]); c.lineTo(p.sh[0], p.sh[1]); c.stroke();
    c.strokeStyle = P.dark; c.lineWidth = 5; // arm
    const sw = g.ground ? 0 : -8;
    c.beginPath(); c.moveTo(p.sh[0], p.sh[1]);
    c.lineTo(p.torso[0] + px * 11 * g.face + p.ux * sw, p.torso[1] + py * 11 * g.face + p.uy * sw); c.stroke();
    c.fillStyle = '#f7d3ac'; c.beginPath(); c.arc(p.head[0], p.head[1], 9, 0, 7); c.fill();
    c.strokeStyle = P.dark; c.lineWidth = 3.5;
    c.beginPath(); c.arc(p.head[0], p.head[1], 9, g.a - 2.6, g.a - 0.55); c.stroke();
    c.fillStyle = '#1b1f2e'; c.beginPath();
    c.arc(p.head[0] + px * 4.5 * g.face + p.ux * 0.5, p.head[1] + py * 4.5 * g.face + p.uy * 0.5, 1.6, 0, 7); c.fill();
  }
}

/* ---------------- TENNIS (tap to rise) ---------------- */
const PAD_H = 28, CEIL = 8;
class Tennis {
  constructor() {
    this.target = 5; this.time = 60; this.events = []; this.errs = [0, 0];
    this.name = 'TENNIS'; this.cheer = 'POINT!'; this.hint = "Tap to rise. Don't let the ball get past you";
    this.pads = [{ x: 44, y: G - 60, vy: 0, face: 1 }, { x: W - 44, y: G - 60, vy: 0, face: -1 }];
    this.reset(Math.random() < 0.5 ? -1 : 1);
  }
  reset(dir) {
    if (!dir) dir = Math.random() < 0.5 ? -1 : 1;
    const a = rnd(-0.5, 0.5);
    this.ball = { x: W / 2, y: rnd(90, 170), r: 7, speed: 185, vx: 0, vy: 0, trail: [] };
    this.ball.vx = Math.cos(a) * 185 * dir; this.ball.vy = Math.sin(a) * 185;
  }
  step(dt, taps) {
    for (let i = 0; i < 2; i++) {
      const p = this.pads[i];
      if (taps[i]) { p.vy = -250; this.events.push('jump'); }
      p.vy += 640 * dt; p.y += p.vy * dt;
      if (p.y < CEIL + PAD_H) { p.y = CEIL + PAD_H; p.vy = 0; }
      if (p.y > G - PAD_H) { p.y = G - PAD_H; p.vy = 0; }
    }
    const b = this.ball;
    b.x += b.vx * dt; b.y += b.vy * dt;

/* ---------------- VOLLEYBALL (your player chases the ball; you just time the hit) ---------------- */
const NET = 72, V_G = 420, V_RUN = 175;
class Volley extends Soccer {
  constructor() {
    super(); this.target = 5; this.time = 90;
    this.name = 'VOLLEYBALL'; this.cheer = 'POINT!'; this.hint = 'Your player chases the ball. Tap to jump and hit it over';
  }
  reset(dir) {
    const s = dir ? (dir > 0 ? 1 : 0) : (Math.random() < 0.5 ? 0 : 1);
    this.rally = 0; this.still = 0; this.roll = [-1, -1]; this.will = [true, true];
    this.guys = [this.mk(0, 120, 0, 14, W / 2 - 18), this.mk(1, W - 120, 0, W / 2 + 18, W - 14)];
    for (const g of this.guys) g.swing = 0;
    this.ball = { x: this.guys[s].x + rnd(-8, 8), y: 16, vx: 0, vy: 0, r: 11, rot: 0 };
  }
  step(dt, taps) {
    const b = this.ball;
    for (const g of this.guys) {
      const own = (b.x < W / 2) === (g.team === 0);
      let tx = g.home;
      if (own) { // run to where the ball will come down
        const yT = G - 58; let t = 0;
        if (b.y < yT) t = (-b.vy + Math.sqrt(b.vy * b.vy + 2 * V_G * (yT - b.y))) / V_G;

        if (g.ground) { g.ground = false; g.vy = -290; this.events.push('jump'); }
        g.swing = 0.45;

      if (!g.ground) { g.vy += GRAV * dt; g.y += g.vy * dt; if (g.y >= G) { g.y = G; g.ground = true; g.vy = 0; } }
    }

    this.seg(b, W / 2, G - NET, W / 2, G);

    if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx) * 0.5; }
    if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy) * 0.5; }

      const h1 = hitCircle(b, p.head[0], p.head[1], 17, 0, g.vy, 0.6);
      const h2 = hitCircle(b, p.torso[0], p.torso[1], 15, 0, g.vy, 0.5);

        else { b.vx = g.face * rnd(170, 230) * k; b.vy = -rnd(300, 350); }                                                    // lob
        this.events.push('kick');

    }
    this.unstick(b, Math.hypot(b.vx, b.vy), dt);
    return -1;
  }
  bot(side, skill) {

    c.globalAlpha = 0.3; c.fillStyle = L.color; c.fillRect(0, G, W / 2, 4); c.fillStyle = R.color; c.fillRect(W / 2, G, W / 2, 4); c.globalAlpha = 1;

    c.fillStyle = '#fff'; c.fillRect(W / 2 - 3, G - NET - 2, 6, 5);

      c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 2; c.beginPath(); c.arc(g.x, g.y - 45, 16, 0, 7); c.stroke();
    }

}

/* ---------------- GOLF (power-bar race) ---------------- */
const CUP = 10;
class Golf {
  constructor() {
    this.target = 3; this.time = 90; this.events = []; this.pending = []; this.race = true;
    this.name = 'GOLF'; this.cheer = ''; this.hint = 'Tap when the power bar is in the green zone';
    this.k = [0, 1].map((side) => ({ side, made: 0, msg: '', msgT: 0 }));
    this.k.forEach((k) => this.hole(k));
  }
  reset() {}
  hole(k) {
    k.tee = k.side ? W - 22 : 22; k.cup = k.side ? W - rnd(120, 215) : rnd(120, 215);
    k.lo = k.side ? W / 2 + 12 : 10; k.hi = k.side ? W - 10 : W / 2 - 12;
    k.bx = k.tee; k.h = 0; k.strokes = 0; this.ready(k);
  }
  ready(k) { k.state = 'aim'; k.D = Math.abs(k.cup - k.bx); k.R = clamp(k.D * 1.8, 50, 260); k.ph = 0; k.age = 0; k.botAim = null; k.dir = Math.sign(k.cup - k.bx) || 1; }
  power(k) { const u = k.ph % 2; return u < 1 ? u : 2 - u; }
  step(dt, taps) {
    for (const k of this.k) {
      if (k.msgT > 0) k.msgT -= dt;
      if (k.state === 'aim') {
        k.ph += dt * 1.1; k.age += dt;
        if (taps[k.side]) {
          const p = this.power(k);
          k.from = k.bx; k.to = clamp(k.bx + k.dir * p * k.R, k.lo, k.hi);
          k.loft = k.R > 90 ? p * k.R * 0.35 : 0; k.dur = 0.5 + 0.5 * p; k.ft = 0;
          k.state = 'fly'; k.strokes++; this.events.push('kick');
        }
      } else if (k.state === 'fly') {
        k.ft += dt; const u = Math.min(1, k.ft / k.dur), e = 1 - (1 - u) * (1 - u);
        k.bx = k.from + (k.to - k.from) * e; k.h = k.loft * Math.sin(Math.PI * Math.min(1, u * 1.3));
        if (u >= 1) {
          k.h = 0;
          if (Math.abs(k.bx - k.cup) <= CUP) {
            k.bx = k.cup; k.made++; this.pending.push(k.side);
            k.msg = k.strokes === 1 ? 'HOLE IN ONE!' : 'IN!'; k.msgT = 1.2; k.state = 'done'; k.t = 1.2;
          } else this.ready(k);
        }
      } else { k.t -= dt; if (k.t <= 0) this.hole(k); }
    }
    return this.pending.length ? this.pending.shift() : -1;
  }
  bot(side, skill) {
    const k = this.k[side]; if (k.state !== 'aim' || k.age < [1, 0.7, 0.5][skill]) return 0;
    if (k.botAim == null) k.botAim = clamp(k.D / k.R + rnd(-1, 1) * (CUP / k.R) * [2.6, 1.5, 1.05][skill], 0.03, 0.97);
    if (Math.abs(this.power(k) - k.botAim) < 0.024) return 0.3;
    return 0;
  }
  draw(c, L, R, t) {
    const sky = c.createLinearGradient(0, 0, 0, G);
    sky.addColorStop(0, '#6ec3f4'); sky.addColorStop(1, '#d8f1ff');
    c.fillStyle = sky; c.fillRect(0, 0, W, G);
    c.fillStyle = '#fff'; for (const [x, y] of [[70, 80], [300, 60], [410, 100]]) { c.beginPath(); c.ellipse(x + Math.sin(t * 0.2 + x) * 6, y, 26, 9, 0, 0, 7); c.fill(); }
    c.fillStyle = '#7cc46a'; c.beginPath(); c.moveTo(0, G); for (let x = 0; x <= W; x += 20) c.lineTo(x, G - 26 - Math.sin(x * 0.02) * 14); c.lineTo(W, G); c.fill();
    c.fillStyle = '#3aa655'; c.fillRect(0, G, W, H - G);
    c.fillStyle = '#58c26f'; c.fillRect(0, G, W, 5);
    c.fillStyle = '#2c6b3a'; c.beginPath(); c.arc(W / 2, G - 36, 20, 0, 7); c.arc(W / 2 - 10, G - 22, 14, 0, 7); c.arc(W / 2 + 10, G - 22, 14, 0, 7); c.fill();
    c.fillStyle = '#5b3a1e'; c.fillRect(W / 2 - 3, G - 16, 6, 16);
    c.textAlign = 'center'; c.textBaseline = 'middle';
    for (const k of this.k) {
      const P = k.side ? R : L;
      // cup + flag
      c.fillStyle = '#103318'; c.beginPath(); c.ellipse(k.cup, G + 3, CUP, 3.5, 0, 0, 7); c.fill();
      c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.moveTo(k.cup, G + 2); c.lineTo(k.cup, G - 44); c.stroke();
      c.fillStyle = P.color; c.beginPath(); c.moveTo(k.cup, G - 44); c.lineTo(k.cup + 16, G - 38); c.lineTo(k.cup, G - 32); c.fill();
      c.fillStyle = '#e9d9a8'; c.fillRect(k.tee - 7, G, 14, 4);

        c.lineCap = 'round'; c.strokeStyle = '#1b1f2e'; c.lineWidth = 5; c.beginPath();

        c.strokeStyle = P.color; c.lineWidth = 15; c.beginPath(); c.moveTo(gx, G - 20); c.lineTo(gx, G - 36); c.stroke();
        c.fillStyle = '#f7d3ac'; c.beginPath(); c.arc(gx, G - 48, 8.5, 0, 7); c.fill();
        c.fillStyle = P.dark; c.beginPath(); c.arc(gx, G - 50, 8.5, Math.PI, 0); c.fill(); c.fillRect(gx + (k.dir > 0 ? 0 : -12), G - 51, 12, 3);

      }
      // ball

      if (k.state !== 'done') { c.fillStyle = '#fff'; c.strokeStyle = '#1b1f2e'; c.lineWidth = 1; c.beginPath(); c.arc(k.bx, G - 4 - k.h, 4, 0, 7); c.fill(); c.stroke(); }
      // power bar
      const mx = (k.side ? W * 0.75 : W * 0.25) - 75, my = 34, mw = 150;

        c.fillStyle = '#fff'; c.fillRect(mx + this.power(k) * mw - 2, my - 3, 4, 22);

      if (k.msgT > 0) big(c, k.msg, mx + mw / 2, 100 - (1.2 - k.msgT) * 10, 24, P.color);
    }
  }
}

/* ---------------- FOOTBALL (field-goal race) ---------------- */
const BAR = 70, FG_V = 400, FG_G = 500;
class Football {

    this.name = 'FOOTBALL'; this.cheer = ''; this.hint = 'Tap to kick when your arrow is aimed over the bar';
    this.k = [{ side: 0, made: 0, msg: '', msgT: 0 }, { side: 1, made: 0, msg: '', msgT: 0 }];
    this.k.forEach((k) => this.setup(k));
  }
  reset() {}
  setup(k) {

    k.d = rnd(100, 215); k.x = W / 2 - f * k.d; k.state = 'aim'; k.judged = false; k.swing = 0;
    k.ph = rnd(0, 6.28); k.speed = 1.6 + k.made * 0.15; k.age = 0;

  }
  angle(k) { return ((47.5 + 37.5 * Math.sin(k.ph)) * Math.PI) / 180; }

          k.state = 'fly'; k.swing = 0.25; this.events.push('kick');
        }

/* ---------------- BASKETBALL (shot-arc race) ---------------- */
const HP_G = 520, HP_SIN = Math.sin(1.047), HP_COS = Math.cos(1.047), RIM = 11;
class Hoops {
  constructor() {
    this.target = 5; this.time = 75; this.events = []; this.pending = []; this.race = true;
    this.name = 'BASKETBALL'; this.cheer = ''; this.hint = 'Tap when the dotted arc drops into the hoop';
    this.k = [0, 1].map((side) => ({ side, made: 0, msg: '', msgT: 0 }));
    this.k.forEach((k) => this.setup(k));
  }
  reset() {}
  setup(k) {
    const f = k.side ? -1 : 1;
    k.rx = W / 2 - f * 34; k.ry = G - 108; k.d = rnd(85, 180); k.sx = k.rx - f * k.d; k.sy = G - 52;
    const h = k.sy - k.ry;
    k.vI = Math.sqrt((HP_G * k.d * k.d) / (2 * HP_COS * HP_COS * (k.d * (HP_SIN / HP_COS) - h)));
    k.lo = rnd(0.72, 0.88); k.hi = rnd(1.12, 1.3); k.ph = 0; k.age = 0; k.botAim = null; k.state = 'aim'; k.ball = null; k.judged = false;
  }
  pwr(k) { const u = k.ph % 2; return u < 1 ? u : 2 - u; }
  speed(k) { return k.vI * (k.lo + (k.hi - k.lo) * this.pwr(k)); }
  step(dt, taps) {
    for (const k of this.k) {
      const f = k.side ? -1 : 1;
      if (k.msgT > 0) k.msgT -= dt;
      if (k.state === 'aim') {
        k.ph += dt * 0.9; k.age += dt;
        if (taps[k.side]) {
          const v = this.speed(k);
          k.ball = { x: k.sx, y: k.sy, vx: f * v * HP_COS, vy: -v * HP_SIN, rot: 0 };
          k.state = 'fly'; this.events.push('jump');
        }
      } else {
        const b = k.ball;
        b.vy += HP_G * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.rot += dt * 8 * f;
        if (!k.judged && b.vy > 0 && b.y >= k.ry) {
          k.judged = true; k.msgT = 1; k.t = 0.9;
          if (Math.abs(b.x - k.rx) < RIM) { k.made++; this.pending.push(k.side); k.msg = 'SWISH!'; k.good = true; b.vx *= 0.15; }
          else { k.msg = 'MISS'; k.good = false; this.events.push('bounce'); }
        }
        if (b.y > G - 7) { b.y = G - 7; b.vy *= -0.5; b.vx *= 0.7; if (!k.judged) { k.judged = true; k.msg = 'MISS'; k.good = false; k.msgT = 1; k.t = 0.9; } }
        if (k.judged) { k.t -= dt; if (k.t <= 0) this.setup(k); }
      }
    }
    return this.pending.length ? this.pending.shift() : -1;
  }
  bot(side, skill) {
    const k = this.k[side]; if (k.state !== 'aim' || k.age < [1, 0.7, 0.5][skill]) return 0;
    if (k.botAim == null) {
      const ideal = (1 - k.lo) / (k.hi - k.lo), tol = RIM / (2 * k.d * (k.hi - k.lo));
      k.botAim = clamp(ideal + rnd(-1, 1) * tol * [2.8, 1.6, 1.05][skill], 0.03, 0.97);
    }
    return Math.abs(this.pwr(k) - k.botAim) < 0.02 ? 0.3 : 0;
  }
  draw(c, L, R, t) {
    c.fillStyle = '#2b3a67'; c.fillRect(0, 0, W, G);
    c.fillStyle = 'rgba(255,255,255,.05)'; for (let x = 0; x < W; x += 48) c.fillRect(x, 0, 24, G);
    c.fillStyle = '#c98a4b'; c.fillRect(0, G, W, H - G); c.fillStyle = '#e0a868'; c.fillRect(0, G, W, 4);
    c.fillStyle = '#3d4a78'; c.fillRect(W / 2 - 4, G - 150, 8, 150);
    for (const k of this.k) {
      const P = k.side ? R : L, f = k.side ? -1 : 1;
      c.fillStyle = '#fff'; c.fillRect(W / 2 - f * 20 - 2, k.ry - 40, 4, 48);                       // backboard
      c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 1; c.beginPath();
      for (let i = -RIM; i <= RIM; i += 5.5) { c.moveTo(k.rx + i, k.ry); c.lineTo(k.rx + i * 0.6, k.ry + 18); } c.stroke();
      c.strokeStyle = '#ff6a2b'; c.lineWidth = 4; c.lineCap = 'round'; c.beginPath(); c.moveTo(k.rx - RIM - 2, k.ry); c.lineTo(k.rx + RIM + 2 + f * 2, k.ry); c.stroke();
      const gx = k.sx - f * 8;
      c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(gx, G + 4, 12, 3, 0, 0, 7); c.fill();
      c.strokeStyle = '#1b1f2e'; c.lineWidth = 5; c.beginPath(); c.moveTo(gx - 3, G - 18); c.lineTo(gx - 4, G); c.moveTo(gx + 3, G - 18); c.lineTo(gx + 4, G); c.stroke();
      c.strokeStyle = P.color; c.lineWidth = 15; c.beginPath(); c.moveTo(gx, G - 20); c.lineTo(gx, G - 36); c.stroke();
      c.strokeStyle = P.dark; c.lineWidth = 4; c.beginPath(); c.moveTo(gx, G - 36); c.lineTo(k.sx, k.sy + 4); c.stroke();
      c.fillStyle = '#f7d3ac'; c.beginPath(); c.arc(gx, G - 47, 8.5, 0, 7); c.fill();
      c.strokeStyle = P.dark; c.lineWidth = 3.5; c.beginPath(); c.arc(gx, G - 47, 8.5, -2.6, -0.55); c.stroke();
      const ball = (x, y, rot) => {
        c.save(); c.translate(x, y); c.rotate(rot); c.fillStyle = '#f08a2c'; c.beginPath(); c.arc(0, 0, 7, 0, 7); c.fill();
        c.strokeStyle = '#3b1e08'; c.lineWidth = 1; c.beginPath(); c.arc(0, 0, 7, 0, 7); c.moveTo(-7, 0); c.lineTo(7, 0); c.stroke(); c.restore();
      };
      if (k.state === 'aim') {
        const v = this.speed(k); c.fillStyle = P.color;
        for (let i = 1; i < 26; i++) {
          const tt = i * 0.055, x = k.sx + f * v * HP_COS * tt, y = k.sy - v * HP_SIN * tt + 0.5 * HP_G * tt * tt;
          if (y > k.ry + 6 && v * HP_SIN - HP_G * tt < 0) break;
          c.globalAlpha = 0.9; c.beginPath(); c.arc(x, y, 2.2, 0, 7); c.fill();
        }
        c.globalAlpha = 1; ball(k.sx, k.sy, 0);
      } else ball(k.ball.x, k.ball.y, k.ball.rot);
      if (k.msgT > 0) big(c, k.msg, W / 2 - f * 120, 50 - (1 - k.msgT) * 8, 24, k.good ? P.color : '#c9d0ea');
    }
  }
}

/* ---------------- BOWLING (race to 40 pins) ---------------- */
const PINS = []; for (let r = 0; r < 4; r++) for (let j = 0; j <= r; j++) PINS.push([(j - r / 2) * 13, 70 - r * 11, r]);
class Bowling {
  constructor() {
    this.target = 40; this.time = 90; this.events = []; this.pending = []; this.race = true;
    this.name = 'BOWLING'; this.cheer = ''; this.hint = 'Tap to roll when the ball lines up with the front pin';
    this.k = [0, 1].map((side) => ({ side, cx: side ? W * 0.75 : W * 0.25, ph: rnd(0, 6.28), state: 'aim', age: 0, botAim: null, down: [], msg: '', msgT: 0, pts: 0 }));
  }
  reset() {}
  step(dt, taps) {
    for (const k of this.k) {
      if (k.msgT > 0) k.msgT -= dt;
      if (k.state === 'aim') {
        k.ph += dt * 1.7; k.age += dt; k.off = 44 * Math.sin(k.ph);
        if (taps[k.side]) { k.state = 'roll'; k.by = 250; k.hit = false; this.events.push('jump'); }
      } else if (k.state === 'roll') {
        k.by -= 270 * dt;
        if (!k.hit && k.by <= 66) {
          k.hit = true; const a = Math.abs(k.off);
          const n = a < 4 ? 10 : a < 8 ? 9 : a < 12 ? 8 : a < 17 ? 6 : a < 23 ? 4 : a < 30 ? 2 : a < 38 ? 1 : 0;
          k.down = PINS.map((p, i) => [Math.abs(p[0] - k.off) + p[2] * 3, i]).sort((x, y) => x[0] - y[0]).slice(0, n).map((x) => x[1]);
          for (let i = 0; i < n; i++) this.pending.push(k.side);
          k.pts = n; k.msg = n === 10 ? 'STRIKE! +10' : n ? '+' + n : 'GUTTER'; k.msgT = 1.2; this.events.push(n ? 'kick' : 'bounce');
        }
        if (k.by < 22) { k.state = 'wait'; k.t = 0.9; }
      } else { k.t -= dt; if (k.t <= 0) { k.state = 'aim'; k.down = []; k.age = 0; k.botAim = null; } }
    }
    return this.pending.length ? this.pending.shift() : -1;
  }
  bot(side, skill) {
    const k = this.k[side]; if (k.state !== 'aim' || k.age < [0.9, 0.6, 0.4][skill]) return 0;
    if (k.botAim == null) k.botAim = rnd(-1, 1) * [30, 16, 7][skill];
    return Math.abs(k.off - k.botAim) < 3.5 ? 0.3 : 0;
  }
  draw(c, L, R, t) {
    c.fillStyle = '#161a2e'; c.fillRect(0, 0, W, H);
    c.textAlign = 'center'; c.textBaseline = 'middle';
    for (const k of this.k) {
      const P = k.side ? R : L;
      c.fillStyle = '#0b0d18'; c.fillRect(k.cx - 62, 20, 124, 250);
      const wood = c.createLinearGradient(0, 20, 0, 270); wood.addColorStop(0, '#b98548'); wood.addColorStop(1, '#e2b673');
      c.fillStyle = wood; c.fillRect(k.cx - 50, 20, 100, 250);
      c.fillStyle = 'rgba(0,0,0,.08)'; for (let x = -40; x < 50; x += 20) c.fillRect(k.cx + x, 20, 1.5, 250);
      c.fillStyle = P.color; for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(k.cx + i * 16, 178 + Math.abs(i) * 8); c.lineTo(k.cx + i * 16 - 4, 190 + Math.abs(i) * 8); c.lineTo(k.cx + i * 16 + 4, 190 + Math.abs(i) * 8); c.fill(); }
      PINS.forEach((p, i) => {
        const dn = k.down.includes(i);
        c.globalAlpha = dn ? 0.25 : 1; c.fillStyle = '#fff'; c.beginPath(); c.arc(k.cx + p[0] + (dn ? 3 : 0), p[1] - (dn ? 4 : 0), 4.5, 0, 7); c.fill();
        c.fillStyle = '#e23b3b'; c.beginPath(); c.arc(k.cx + p[0] + (dn ? 3 : 0), p[1] - (dn ? 4 : 0), 1.8, 0, 7); c.fill();
      });
      c.globalAlpha = 1;
      if (k.state !== 'wait') {
        const by = k.state === 'aim' ? 250 : k.by;
        if (k.state === 'aim') { c.strokeStyle = 'rgba(255,255,255,.35)'; c.setLineDash([4, 6]); c.lineWidth = 1.5; c.beginPath(); c.moveTo(k.cx + k.off, 240); c.lineTo(k.cx + k.off, 82); c.stroke(); c.setLineDash([]); }
        c.fillStyle = P.dark; c.beginPath(); c.arc(k.cx + k.off, by, 8, 0, 7); c.fill();
        c.fillStyle = P.color; c.beginPath(); c.arc(k.cx + k.off - 1.5, by - 1.5, 6, 0, 7); c.fill();
      }
      if (k.msgT > 0) big(c, k.msg, k.cx, 130 - (1.2 - k.msgT) * 8, 22, k.pts ? P.color : '#c9d0ea');
    }
  }
}

/* ================= EVERYONE-AT-ONCE GAMES (2 to 4 players in one arena) ================= */
function tagText(c, P, x, y, size) {

/* ---- SUMO BUMP ---- */
class Sumo {
  constructor(n) {
    this.n = n; this.events = []; this.name = 'SUMO BUMP'; this.hint = "You spin on your own. Tap to dash where you're pointing and knock the others off";
    this.R = 118; this.t = 0; this.out = [];
    this.p = [...Array(n)].map((_, i) => { const a = (i / n) * 6.283 + 0.6; return { x: 240 + Math.cos(a) * 70, y: 150 + Math.sin(a) * 70, vx: 0, vy: 0, ang: a + Math.PI, lives: 3, cd: 0, fall: 0, spin: i % 2 ? -1 : 1 }; });
  }
  status(i) { return '♥'.repeat(Math.max(0, this.p[i].lives)) || 'OUT'; }
  step(dt, taps) {
    this.t += dt; if (this.t > 25) this.R = Math.max(0, 118 - (this.t - 25) * 4);
    const live = [];
    this.p.forEach((q, i) => {
      if (q.fall > 0) { q.fall -= dt; if (q.fall <= 0 && q.lives > 0) { const a = rnd(0, 6.28), r = Math.min(25, this.R * 0.4); q.x = 240 + Math.cos(a) * r; q.y = 150 + Math.sin(a) * r; q.vx = q.vy = 0; } return; }
      if (q.lives <= 0) return;

/* ---- QUICK DRAW ---- */
class QuickDraw {
  constructor(n) {
    this.n = n; this.events = []; this.name = 'QUICK DRAW'; this.hint = 'Wait for green, then tap first. Tap early and you lose a point';
    this.score = Array(n).fill(0); this.rounds = 0; this.note = Array(n).fill(''); this.round();
  }
  status(i) { return this.score[i] + ' / 3'; }

  step(dt, taps) {

      this.timer -= dt;

        if (Math.max(...this.score) >= 3 || this.rounds >= 25) return this.score.map((s, i) => i).sort((a, b) => this.score[b] - this.score[a]);
        this.round();
      }

    }
    this.t += dt;
    if (this.state === 'wait') {
      for (let i = 0; i < this.n; i++) if (taps[i] && !this.foul[i]) { this.foul[i] = true; this.score[i] = Math.max(0, this.score[i] - 1); this.note[i] = 'TOO EARLY  −1'; this.events.push('bounce'); }

        if (taps[i] && !this.foul[i]) { this.score[i]++; this.note[i] = '+1   ' + this.goT.toFixed(2) + 's'; this.state = 'show'; this.timer = 1.6; this.events.push('kick'); break; }
      }

  }

const SPORTS = { soccer: Soccer, tennis: Tennis, football: Football, volley: Volley, golf: Golf, darts: Darts, hoops: Hoops, bowling: Bowling };

      c.fillText(P.name, x + d * 34, 23);

    c.fillText(this.score[0] + '  –  ' + this.score[1], PW / 2, 19);
    c.font = '700 9px system-ui,sans-serif'; c.fillStyle = this.golden ? '#ffc83a' : '#9aa6d1';
    const s = Math.ceil(this.clock);

      big(c, this.title, W / 2, 36, 24, '#fff'); big(c, this.sim.name, W / 2, 66, 15, '#ffc83a');
      const keyCap = (P, x, isCpu) => {
        c.fillStyle = P.color; rr(c, x - 30, 96, 60, 60, 12); c.fill();
        c.fillStyle = '#0b1026'; c.font = '900 ' + (isCpu ? 20 : 38) + 'px system-ui,sans-serif';

    else if (e === 'jump') beep(420, 0.05, 'sine', 0.025, 620);

  }

  function start() {
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) {}
    const S = seats();
    if (count === 2) {
      if (sport !== 'mix') return play([mk(sport, S, 'HEAD TO HEAD')], (r) => results(r[0].order, r[0].score ? 'Final score ' + Math.max(...r[0].score) + ' – ' + Math.min(...r[0].score) : ''));
      const order = shuffle([...DUEL_KEYS, ...FFA_KEYS]).slice(0, 5), wins = [0, 0];
      const game = (n) => play([mk(order[n], S, 'GAME ' + (n + 1))], (r) => {
        const w = r[0].order[0]; wins[w === S[0] ? 0 : 1]++;
        if (Math.max(...wins) >= 3) return results(wins[0] > wins[1] ? S : [S[1], S[0]], 'Series ' + Math.max(...wins) + ' – ' + Math.min(...wins));
        inter(PLAYERS[w].name + ' takes game ' + (n + 1),
          row('SERIES · FIRST TO 3', tag(S[0]) + ' <i>' + wins[0] + ' – ' + wins[1] + '</i> ' + tag(S[1])) +
          row('NEXT GAME', NAMES[order[n + 1]]) + '<div class="note">' + HOW[order[n + 1]] + '</div>', () => game(n + 1), 'Next game');
      });
      return game(0);
    }
    if (DUEL_KEYS.includes(sport)) { // four players, bracket
      return play([mk(sport, [0, 1], 'SEMIFINAL 1'), mk(sport, [2, 3], 'SEMIFINAL 2')], (r) =>
        finals([r[0].order[0], r[1].order[0], r[0].order[1], r[1].order[1]], sport, 'Semifinals done'));
    }
    if (sport !== 'mix') { // one everyone-at-once game, then a final in the same game
      return play([mk(sport, S, 'EVERYONE IN')], (r) => finals(r[0].order, sport, PLAYERS[r[0].order[0]].name + ' wins the opener'));
    }
    // mix: three everyone-at-once rounds for points, then head-to-head finals
    const games = shuffle(FFA_KEYS).slice(0, 3), pts = {}, lastPlace = {};
    S.forEach((p) => (pts[p] = 0));
    const round = (n) => play([mk(games[n], S, 'ROUND ' + (n + 1) + ' OF 3')], (r) => {
      r[0].order.forEach((p, i) => { pts[p] += [3, 2, 1, 0][i]; lastPlace[p] = i; });
      const ranked = S.slice().sort((a, b) => pts[b] - pts[a] || lastPlace[a] - lastPlace[b]);
      const table = ranked.map((p, i) => '<div class="place sm" style="--pc:' + PLAYERS[p].color + '"><span>' + (i + 1) + '</span><b>' + PLAYERS[p].name +
        '</b><em>+' + [3, 2, 1, 0][lastPlace[p]] + '</em><strong>' + pts[p] + ' pts</strong></div>').join('');
      if (n < 2) inter('Standings after round ' + (n + 1), table + '<div class="note"><b>Next: ' + NAMES[games[n + 1]] + '.</b> ' + HOW[games[n + 1]] + '</div>', () => round(n + 1), 'Next round');
      else inter('Final standings before the finals', table, () => finals(ranked, pick(DUEL_KEYS), 'Finals time'), 'On to the finals');
    });
    round(0);
  }

  // input
  addEventListener('keydown', (e) => {
    if (e.repeat) return;
    const i = PLAYERS.findIndex((P) => P.code === e.code);
    if (i >= 0) { e.preventDefault(); press(i); return; }
    if (e.code === 'Enter' || e.code === 'Space') {
      e.preventDefault();
      if (state === 'lobby') start(); else if (state === 'inter') nextFn(); else if (state === 'results') toLobby();
    } else if (e.code === 'Escape') toLobby();
  });
  function press(i) {
    if (state === 'lobby') { if (seats().includes(i)) { joined[i] = !joined[i]; refresh(); } }
    else if (state === 'play') taps[i] = true;
  }
  const padPrev = [false, false, false, false];
  function pollPads() {
    let pads; try { pads = navigator.getGamepads ? navigator.getGamepads() : []; } catch (e) { return; }
    for (let i = 0; i < 4; i++) {
      const p = pads && pads[i]; const down = !!p && p.buttons.some((b) => b.pressed);
      const seat = seats()[i];
      if (down && !padPrev[i] && seat != null) press(seat);
      padPrev[i] = down;
    }
  }

  // layout + loop
  let lay = { s: 1, x: [0, 0], y: [0, 0] };
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2), w = innerWidth, h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + 'px'; cv.style.height = h + 'px';
    const gap = 14, m = 12;
    if (matches.length === 1) {
      const s = Math.min((w - 2 * m) / PW, (h - 2 * m) / PH);
      lay = { s: s * dpr, x: [((w - PW * s) / 2) * dpr], y: [((h - PH * s) / 2) * dpr] };
      return;
    }
    const sSide = Math.min((w - 2 * m - gap) / (2 * PW), (h - 2 * m) / PH);
    const sStack = Math.min((w - 2 * m) / PW, (h - 2 * m - gap) / (2 * PH));
    if (sSide >= sStack) {
      const s = sSide, x0 = (w - (2 * PW * s + gap)) / 2, y0 = (h - PH * s) / 2;
      lay = { s: s * dpr, x: [x0 * dpr, (x0 + PW * s + gap) * dpr], y: [y0 * dpr, y0 * dpr] };
    } else {
      const s = sStack, x0 = (w - PW * s) / 2, y0 = (h - (2 * PH * s + gap)) / 2;
      lay = { s: s * dpr, x: [x0 * dpr, x0 * dpr], y: [y0 * dpr, (y0 + PH * s + gap) * dpr] };
    }
  }
  addEventListener('resize', resize); resize();

  const STEP = 1 / 120; let acc = 0, last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    pollPads();
    if (state === 'play') {
      acc += dt; let first = true; const none = [false, false, false, false];
      while (acc >= STEP) {
        for (const m of matches) m.update(STEP, first ? taps : none);
        if (first) { taps.fill(false); first = false; }
        acc -= STEP;
      }
      if (matches.every((m) => m.done && m.doneT > 2.2)) { const f = doneFn; doneFn = null; state = 'idle'; f(matches); }
    } else if (state === 'inter') {
      interT -= dt; $('skip').textContent = nextLabel + ' (' + Math.max(1, Math.ceil(interT)) + ')';
      if (interT <= 0) nextFn();
    }
    c.setTransform(1, 0, 0, 1, 0, 0);
    const bgr = c.createRadialGradient(cv.width / 2, cv.height * 0.4, 0, cv.width / 2, cv.height * 0.4, Math.max(cv.width, cv.height) * 0.7);
    bgr.addColorStop(0, '#1b2760'); bgr.addColorStop(1, '#05081a'); c.fillStyle = bgr; c.fillRect(0, 0, cv.width, cv.height);
    matches.forEach((m, i) => {
      c.setTransform(lay.s, 0, 0, lay.s, lay.x[i], lay.y[i]);
      c.fillStyle = 'rgba(0,0,0,.45)'; rr(c, -3, 3, PW + 6, PH + 8, 15); c.fill();
      c.fillStyle = '#141a33'; rr(c, -4, -4, PW + 8, PH + 8, 14); c.fill();
      c.save(); rr(c, 0, 0, PW, PH, 10); c.clip(); m.draw(c, PLAYERS); c.restore();
      c.strokeStyle = 'rgba(255,255,255,.14)'; c.lineWidth = 1.5; rr(c, 0.75, 0.75, PW - 1.5, PH - 1.5, 10); c.stroke();
    });
    requestAnimationFrame(frame);
  }
  refresh(); show('lobby'); requestAnimationFrame(frame);
}

if (typeof document !== 'undefined') boot();
else module.exports = { Match, Party, SPORTS, FFA_GAMES };

</script>
</body>
