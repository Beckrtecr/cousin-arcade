<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#18213a"/><stop offset="1" stop-color="#07090f"/>
    </radialGradient>
    <radialGradient id="g" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#b8ffd6"/><stop offset=".5" stop-color="#2fd774"/><stop offset="1" stop-color="#0f6b38"/>
    </radialGradient>
    <radialGradient id="p" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#ffc0e0"/><stop offset=".5" stop-color="#ff5fa8"/><stop offset="1" stop-color="#8e1f55"/>
    </radialGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <!-- food dots -->
  <g>
    <circle cx="40" cy="40" r="4" fill="#ffd23f"/><circle cx="280" cy="30" r="4" fill="#3fd4ff"/><circle cx="250" cy="160" r="4" fill="#b98cff"/>
    <circle cx="70" cy="170" r="4" fill="#ff7a5c"/><circle cx="170" cy="120" r="5" fill="#5dfc9b"/><circle cx="300" cy="110" r="4" fill="#ffd23f"/>
    <circle cx="20" cy="110" r="4" fill="#3fd4ff"/><circle cx="130" cy="180" r="4" fill="#ff7ac3"/>
  </g>
  <!-- pink snake -->
  <g fill="url(#p)" stroke="rgba(0,0,0,.4)" stroke-width="1.5">
    <circle cx="300" cy="70" r="11"/><circle cx="288" cy="76" r="11"/><circle cx="276" cy="82" r="11"/><circle cx="264" cy="86" r="11"/>
    <circle cx="252" cy="88" r="11"/><circle cx="240" cy="88" r="11"/><circle cx="228" cy="86" r="12"/>
  </g>
  <!-- green snake (player) -->
  <g fill="url(#g)" stroke="rgba(0,0,0,.4)" stroke-width="1.5">
    <circle cx="40" cy="150" r="14"/><circle cx="52" cy="140" r="14"/><circle cx="64" cy="131" r="14"/><circle cx="78" cy="124" r="14"/>
    <circle cx="93" cy="120" r="14"/><circle cx="108" cy="118" r="14"/><circle cx="123" cy="117" r="14"/><circle cx="138" cy="114" r="14"/>
    <circle cx="152" cy="108" r="15"/>
  </g>
  <circle cx="157" cy="101" r="5" fill="#fff"/><circle cx="159" cy="100" r="2.6" fill="#0b0d14"/>
  <circle cx="160" cy="114" r="5" fill="#fff"/><circle cx="162" cy="113" r="2.6" fill="#0b0d14"/>
  <text x="160" y="48" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="32" fill="#5dfc9b" stroke="#07090f" stroke-width="5" paint-order="stroke">SERPENT ARENA</text>
</svg>
