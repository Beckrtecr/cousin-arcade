<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- checkered laundry room floor -->
  <defs>
    <pattern id="fl" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#fde7c8"/><rect width="20" height="20" fill="#f9dcb6"/><rect x="20" y="20" width="20" height="20" fill="#f9dcb6"/>
    </pattern>
  </defs>
  <rect width="320" height="200" fill="url(#fl)"/>
  <!-- room walls -->
  <g fill="#7aa7d9" stroke="#3f6697" stroke-width="3">
    <rect x="-5" y="-5" width="330" height="22"/><rect x="-5" y="183" width="330" height="22"/>
  </g>
  <!-- washing machine -->
  <g transform="translate(222 30)">
    <rect width="70" height="70" rx="10" fill="#f4f7fb" stroke="#56688c" stroke-width="3.5"/>
    <rect x="5" y="5" width="60" height="13" rx="5" fill="#dfe8f4"/>
    <circle cx="14" cy="11.5" r="3.5" fill="#ff8fb1"/><circle cx="25" cy="11.5" r="3.5" fill="#6fd0ff"/>
    <circle cx="35" cy="44" r="22" fill="#b8c4d6"/><circle cx="35" cy="44" r="18" fill="#8fd3ff"/>
    <path d="M28 33 h8 v12 q0 4 6 4 q4 2 0 6 h-12 q-3 0 -2 -4 z" fill="#ff6b9a" stroke="#3b2a5a" stroke-width="1.5"/>
    <path d="M24 36 a12 12 0 0 1 8 -8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- folded towels -->
  <g stroke="rgba(60,30,80,.45)" stroke-width="2.5">
    <rect x="22" y="128" width="36" height="34" rx="8" fill="#ff9ec4"/><rect x="60" y="128" width="36" height="34" rx="8" fill="#8ee3c8"/>
    <rect x="98" y="128" width="36" height="34" rx="8" fill="#ffd56b"/>
  </g>
  <!-- socks to gobble -->
  <g stroke="rgba(60,30,80,.55)" stroke-width="2">
    <path d="M140 92 h8 v14 q0 5 8 5 q5 3 0 8 h-14 q-4 0 -3 -5 z" fill="#4fc3f7"/>
    <path d="M172 92 h8 v14 q0 5 8 5 q5 3 0 8 h-14 q-4 0 -3 -5 z" fill="#7ed957"/>
    <path d="M204 92 h8 v14 q0 5 8 5 q5 3 0 8 h-14 q-4 0 -3 -5 z" fill="#ffb02e"/>
    <path d="M236 130 h8 v14 q0 5 8 5 q5 3 0 8 h-14 q-4 0 -3 -5 z" fill="#ff6b9a"/>
  </g>
  <!-- dryer sheet -->
  <path d="M262 128 q14 -4 28 0 q4 14 0 28 q-14 -3 -28 0 q-3 -14 0 -28 z" fill="#fff" stroke="#8fc9f2" stroke-width="2.5"/>
  <!-- Gobbles' striped tail -->
  <g stroke="rgba(70,20,120,.4)" stroke-width="1.5">
    <circle cx="44" cy="96" r="11" fill="#ffd35c"/><circle cx="30" cy="90" r="10" fill="#c79bff"/>
    <circle cx="18" cy="82" r="9" fill="#ffd35c"/><circle cx="9" cy="72" r="8" fill="#c79bff"/>
  </g>
  <!-- Gobbles -->
  <g transform="translate(88 104)">
    <g fill="#6a2fb8">
      <circle cx="36" cy="0" r="10"/><circle cx="-36" cy="0" r="10"/><circle cx="0" cy="36" r="10"/><circle cx="0" cy="-36" r="10"/>
      <circle cx="25" cy="25" r="10"/><circle cx="-25" cy="25" r="10"/><circle cx="25" cy="-25" r="10"/><circle cx="-25" cy="-25" r="10"/>
    </g>
    <circle r="40" fill="#9b59e6"/>
    <path d="M2 0 L40 -22 A40 40 0 0 1 40 22 Z" fill="#3a1046"/>
    <circle cx="26" cy="0" r="7" fill="#ff7aa8"/>
    <circle cx="-14" cy="-20" r="15" fill="#fff" stroke="#3a1046" stroke-width="2.5"/><circle cx="18" cy="-24" r="15" fill="#fff" stroke="#3a1046" stroke-width="2.5"/>
    <circle cx="-8" cy="-19" r="6.5" fill="#1c0d29"/><circle cx="25" cy="-22" r="6.5" fill="#1c0d29"/>
  </g>
  <!-- a grumpy Dust Bunny -->
  <g transform="translate(176 156)">
    <path d="M0 -25 l6 5 l8 -4 l3 8 l9 1 l-2 9 l7 6 l-7 6 l2 9 l-9 1 l-3 8 l-8 -4 l-6 5 l-6 -5 l-8 4 l-3 -8 l-9 -1 l2 -9 l-7 -6 l7 -6 l-2 -9 l9 -1 l3 -8 l8 4 z" fill="#9d9aab" stroke="#6c6878" stroke-width="2.5" stroke-linejoin="round"/>
    <g fill="#ff5a5f"><ellipse cx="-5" cy="-27" rx="3" ry="7" transform="rotate(-25 -5 -27)"/><ellipse cx="0" cy="-29" rx="3" ry="7"/><ellipse cx="5" cy="-27" rx="3" ry="7" transform="rotate(25 5 -27)"/></g>
    <ellipse cx="-8" cy="-3" rx="6" ry="7" fill="#fff"/><ellipse cx="8" cy="-3" rx="6" ry="7" fill="#fff"/>
    <circle cx="-9" cy="-1" r="3" fill="#1e1a2a"/><circle cx="7" cy="-1" r="3" fill="#1e1a2a"/>
    <path d="M-15 -12 L-3 -7 M15 -12 L3 -7" stroke="#2b2733" stroke-width="3" stroke-linecap="round"/>
    <path d="M-5 11 q5 -4 10 0" fill="none" stroke="#2b2733" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
