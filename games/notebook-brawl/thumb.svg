<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <rect width="320" height="200" fill="#fbfbf5"/>
  <g stroke="#a9c4e6" stroke-width="1.2">
    <line x1="0" y1="30" x2="320" y2="30"/><line x1="0" y1="52" x2="320" y2="52"/><line x1="0" y1="74" x2="320" y2="74"/>
    <line x1="0" y1="96" x2="320" y2="96"/><line x1="0" y1="118" x2="320" y2="118"/><line x1="0" y1="140" x2="320" y2="140"/>
    <line x1="0" y1="162" x2="320" y2="162"/><line x1="0" y1="184" x2="320" y2="184"/>
  </g>
  <line x1="34" y1="0" x2="34" y2="200" stroke="#e7908d" stroke-width="2"/>
  <rect x="0" y="170" width="320" height="30" fill="#4a5066"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="5">
    <!-- red stickman: flying kick -->
    <g stroke="#d33a2c">
      <circle cx="112" cy="88" r="13" fill="#fbfbf5"/>
      <path d="M112 101 L104 132"/>
      <path d="M108 112 L130 104 M108 112 L88 118"/>
      <path d="M104 132 L140 124 M104 132 L92 160"/>
    </g>
    <!-- sword -->
    <path d="M86 120 L62 96" stroke="#1f2230" stroke-width="4"/>
    <!-- blue stickman: recoiling -->
    <g stroke="#2a5bd7">
      <circle cx="206" cy="96" r="13" fill="#fbfbf5"/>
      <path d="M200 108 L212 140"/>
      <path d="M204 118 L226 106 M204 118 L182 112"/>
      <path d="M212 140 L200 170 M212 140 L230 170"/>
    </g>
    <path d="M232 104 L256 82" stroke="#8a5a2b" stroke-width="6"/>
  </g>
  <!-- POW burst -->
  <polygon points="160,92 168,104 182,100 174,112 186,122 170,122 166,136 158,124 146,132 150,118 138,110 152,106" fill="#ffd84a" stroke="#1f2230" stroke-width="2.5"/>
  <text x="162" y="118" text-anchor="middle" font-family="Permanent Marker, Comic Sans MS, cursive" font-weight="900" font-size="12" fill="#1f2230">POW!</text>
  <text x="160" y="42" text-anchor="middle" font-family="Permanent Marker, Comic Sans MS, Arial Black, cursive" font-weight="900" font-size="30" fill="#fbfbf5" stroke="#1f2230" stroke-width="6" paint-order="stroke" transform="rotate(-2 160 42)">NOTEBOOK BRAWL</text>
</svg>
